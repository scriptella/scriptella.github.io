<svg xmlns="http://www.w3.org/2000/svg" width="320" height="500" viewBox="0 0 320 500" role="img" aria-labelledby="title desc">
  <title id="title">One nested script execution per row</title><desc id="desc">A source query emits rows. The current row supplies variables to the destination script, which executes once per row.</desc>
  <style>
    :root {
      --diagram-bg: #f4f7fa;
      --diagram-box: #ffffff;
      --diagram-text: #233746;
      --diagram-border: #708a9d;
      --diagram-arrow: #526777;
    }
    /* Embedded SVGs inherit the page's color-scheme, including manual theme selection. */
    @media (prefers-color-scheme: dark) {
      :root {
        --diagram-bg: #181818;
        --diagram-box: #242424;
        --diagram-text: #e4e9ed;
        --diagram-border: #708a9d;
        --diagram-arrow: #9bb0bf;
      }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--diagram-arrow)"/></marker></defs>
  <rect width="320" height="500" rx="12" fill="var(--diagram-bg)"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="var(--diagram-text)">
    <rect x="15" y="20" width="290" height="120" rx="8" fill="var(--diagram-box)" stroke="var(--diagram-border)" stroke-width="1.5"/>
    <text x="160" y="52" font-size="18" font-weight="600">Source query</text>
    <text x="160" y="80" font-size="16">Reads two rows</text>
    <text x="160" y="108" font-size="16">from CSV or SELECT</text>
    <path d="M160 145 V180" fill="none" stroke="var(--diagram-arrow)" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="15" y="190" width="290" height="120" rx="8" fill="var(--diagram-box)" stroke="var(--diagram-border)" stroke-width="1.5"/>
    <text x="160" y="222" font-size="18" font-weight="600">Current row variables</text>
    <text x="160" y="250" font-size="16">Row 1: id=1, name=Ada</text>
    <text x="160" y="278" font-size="16">Row 2: id=2, name=Grace</text>
    <path d="M160 315 V350" fill="none" stroke="var(--diagram-arrow)" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="15" y="360" width="290" height="120" rx="8" fill="var(--diagram-box)" stroke="var(--diagram-border)" stroke-width="1.5"/>
    <text x="160" y="392" font-size="18" font-weight="600">Nested destination script</text>
    <text x="160" y="420" font-size="16">Runs once per row</text>
    <text x="160" y="448" font-size="16">Two rows → two executions</text>
  </g>
</svg>
