    <h1>Scriptella ETL Viewer</h1>

      Your ETL scripts never leave your browser. All processing happens locally on your device. No uploads, tracking or external dependencies.
    </div>

      <label for="file">Open a local XML file</label>
      <input type="file" id="file" accept=".xml,text/xml,application/xml">

    const input = document.getElementById("source");
    const file = document.getElementById("file");
    const output = document.getElementById("output");
    const status = document.getElementById("status");
    const manualCopy = document.getElementById("manual-copy");
    const htmlSource = document.getElementById("html-source");
    const copy = document.getElementById("copy");
    const exportButton = document.getElementById("export");
    const sample = "\u003c!DOCTYPE etl SYSTEM \"http://scriptella.org/dtd/etl.dtd\">\n\u003cetl>\n  \u003cconnection driver=\"h2\" url=\"jdbc:h2:mem:demo\"/>\n  \u003cscript>\n    CREATE TABLE people (id INT, name VARCHAR(100));\n    INSERT INTO people VALUES (1, 'Ada');\n  \u003c/script>\n\u003c/etl>";

      htmlSource.value = "";

      source = text;
      input.value = text;
      status.textContent = "";
      render();
    }

      revision++;
      source = input.value;
      status.textContent = "";
      render();
    });

    function decodeXml(buffer) {
      const bytes = new Uint8Array(buffer);
      const [first, second, third, fourth] = bytes;
      let encoding = "utf-8";
      if ((first === 0xff && second === 0xfe && third === 0 && fourth === 0) ||
          (first === 0 && second === 0 && third === 0xfe && fourth === 0xff)) {
        throw new Error("UTF-32 files are unsupported.");
      }
      if ((first === 0xff && second === 0xfe) || (first === 0x3c && second === 0)) {
        encoding = "utf-16le";
      } else if ((first === 0xfe && second === 0xff) || (first === 0 && second === 0x3c)) {
        encoding = "utf-16be";

      // report its declared encoding even when the body contains invalid UTF-8.

        // Report undecodable bytes through the same file-open status.
      }
      throw new Error("The file is not valid UTF-8 or UTF-16 XML text.");
    }

    file.addEventListener("change", async () => {
      const selected = file.files[0];
      if (!selected) return;
      file.value = "";
      const opening = ++revision;
      if (selected.size > maxInputBytes) {
        status.textContent = inputLimitMessage;
        return;
      }
      let bytes;
      try {
        bytes = await selected.arrayBuffer();
      } catch {
        if (opening === revision) status.textContent = "Could not read the selected file.";
        return;
      }
      if (opening !== revision) return;
      try {
        load(decodeXml(bytes));
      } catch (error) {
        status.textContent = error.message + " Save it as UTF-8 or UTF-16 and try again.";
      }
    });

    document.getElementById("sample").addEventListener("click", () => {
      revision++;
      load(sample);
    });

    function standaloneHtml() {
      const css = document.getElementById("highlight-styles").textContent;
      const markup = output.innerHTML.replace(/\r/g, "&#13;");
      return '<!doctype html>\n<html lang="en"><meta charset="utf-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1">' +
        '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:">' +
        '<link rel="icon" href="data:,"><title>Highlighted Scriptella ETL</title>' +
        '<style>' + css + '</style><pre><code>' + markup + '</code></pre></html>';
    }

    exportButton.addEventListener("click", () => {
      const url = URL.createObjectURL(new Blob([standaloneHtml()], { type: "text/html" }));
      const link = document.createElement("a");
      link.href = url;
      link.download = "etl-highlighted.html";
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      status.textContent = "Highlighted HTML exported.";
    });

    copy.addEventListener("click", async () => {
      const html = standaloneHtml();
      try {
        await navigator.clipboard.writeText(html);
        status.textContent = "Highlighted HTML copied.";
      } catch {
        manualCopy.hidden = false;
        htmlSource.value = html;
        htmlSource.focus();
        htmlSource.select();
        status.textContent = "Use your browser’s copy command to copy the selected HTML.";
      }
    });

    function loadFragment() {
      if (!location.hash.startsWith("#etl=")) return;
      revision++;
      const fragment = location.hash.slice(5);
      try {
        history.replaceState(null, "", location.href.split("#")[0]);
